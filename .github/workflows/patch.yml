name: Patch

on:
  workflow_dispatch:
jobs:
  Version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.previoustag.outputs.tag }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get Previous tag
        id: previoustag
        uses: WyriHaximus/github-action-get-previous-tag@v2
        with:
          fallback: 1.0.0

      - name: Get changelog
        id: changelog
        run: |
          echo 'changelog<<CHANGELOG_BODY_EOF' >> $GITHUB_OUTPUT
          git log $(git describe --tags --abbrev=0)..HEAD --oneline --no-merges >> $GITHUB_OUTPUT
          echo 'CHANGELOG_BODY_EOF' >> $GITHUB_OUTPUT
  Build:
    runs-on: windows-latest
    needs: Version
    env:
        DOTNET_INSTALL_DIR: "D:/tools/dotnet"
        DOTNET_ROOT: "D:/tools/dotnet"
        NUGET_PACKAGES: "D:/.nuget/packages"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Install dependencies
        run: dotnet restore --locked-mode

      - name: Publish
        run: dotnet publish WPFUI -c Release --no-restore --self-contained -p:PublishSingleFile=true -p:AssemblyVersion=${{needs.version.outputs.version}}

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: TTwarsBotSharp-${{needs.version.outputs.version}}
          path: WPFUI\bin\Release\net8.0-windows10.0.19041.0\win-x64\publish\
          if-no-files-found: error

  Release:
    runs-on: ubuntu-latest
    permissions:
        contents: write
    needs: [Build, Version]
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          path: TTwarsBotSharp

      - name: Archive release
        run: |
          cd TTwarsBotSharp; zip -r "TTwarsBotSharp-${{needs.version.outputs.version}}.zip" TTwarsBotSharp-${{needs.version.outputs.version}}; cp -R "TTwarsBotSharp-${{needs.version.outputs.version}}.zip" ../; cd ..

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          name: TTwarsBotSharp-${{needs.version.outputs.version}}
          tag: ${{needs.version.outputs.version}}
          commit: main
          artifacts: "TTwarsBotSharp-${{needs.version.outputs.version}}.zip"
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            **Changelog**:
              ${{needs.version.outputs.changelog}}
  Clear:
    runs-on: ubuntu-latest
    needs: Release
    steps:
      - name: Delete artifact
        uses: geekyeggo/delete-artifact@v6
        with:
          name: TTwarsBotSharp
